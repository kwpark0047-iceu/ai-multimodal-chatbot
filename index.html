<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 서비스 포털 — 2026</title>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d2e;
      --surface2: #242740;
      --border: #2e3250;
      --accent: #6366f1;
      --accent2: #818cf8;
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --top-h: 64px;
      --side-w: 200px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; }

    /* ── TOP NAV ── */
    header {
      position: fixed; top: 0; left: 0; right: 0; height: var(--top-h);
      background: rgba(15,17,23,.92); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; padding: 0 24px; gap: 8px; z-index: 100;
    }
    .logo { font-size: 1.2rem; font-weight: 700; margin-right: 24px;
      background: linear-gradient(135deg, #6366f1, #a78bfa, #38bdf8);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; white-space: nowrap; }
    .top-btn {
      padding: 8px 18px; border-radius: 8px; border: 1px solid var(--border);
      background: transparent; color: var(--text-muted); font-size: .9rem; cursor: pointer;
      transition: all .2s; white-space: nowrap;
    }
    .top-btn:hover { background: var(--surface2); color: var(--text); }
    .top-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }

    /* ── LAYOUT ── */
    .layout { display: flex; margin-top: var(--top-h); min-height: calc(100vh - var(--top-h)); }

    /* ── SIDEBAR ── */
    aside {
      width: var(--side-w); flex-shrink: 0; position: sticky; top: var(--top-h);
      height: calc(100vh - var(--top-h)); overflow-y: auto;
      background: var(--surface); border-right: 1px solid var(--border);
      padding: 20px 12px;
    }
    .side-label { font-size: .7rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: .1em; color: var(--text-muted); padding: 0 8px 10px; }
    .side-btn {
      display: flex; align-items: center; gap: 8px; width: 100%;
      padding: 9px 12px; border-radius: 8px; border: none;
      background: transparent; color: var(--text-muted); font-size: .875rem;
      cursor: pointer; transition: all .15s; text-align: left;
    }
    .side-btn:hover { background: var(--surface2); color: var(--text); }
    .side-btn.active { background: rgba(99,102,241,.15); color: var(--accent2); font-weight: 600; }
    .side-count { margin-left: auto; background: var(--surface2); color: var(--text-muted);
      font-size: .7rem; padding: 2px 7px; border-radius: 20px; }

    /* ── MAIN ── */
    main { flex: 1; padding: 28px 32px; overflow: auto; }
    .section-header { margin-bottom: 24px; }
    .section-title { font-size: 1.5rem; font-weight: 700; }
    .section-desc { color: var(--text-muted); font-size: .9rem; margin-top: 4px; }

    /* ── SEARCH ── */
    .search-wrap { position: relative; margin-bottom: 28px; max-width: 400px; }
    .search-wrap input {
      width: 100%; padding: 10px 16px 10px 40px; border-radius: 10px;
      border: 1px solid var(--border); background: var(--surface);
      color: var(--text); font-size: .9rem; outline: none; transition: border .2s;
    }
    .search-wrap input:focus { border-color: var(--accent); }
    .search-wrap::before { content: '🔍'; position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: .85rem; }

    /* ── CARDS ── */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
    .card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
      padding: 20px; cursor: pointer; text-decoration: none; color: inherit;
      transition: transform .2s, box-shadow .2s, border-color .2s;
      display: flex; flex-direction: column; gap: 10px; position: relative; overflow: hidden;
    }
    .card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
      background: var(--card-color, var(--accent)); opacity: .8;
    }
    .card:hover { transform: translateY(-4px); box-shadow: 0 12px 40px rgba(0,0,0,.4); border-color: var(--accent); }
    .card-top { display: flex; align-items: center; gap: 12px; }
    .card-icon {
      width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center;
      justify-content: center; font-size: 1.4rem; flex-shrink: 0;
      background: rgba(255,255,255,.06);
    }
    .card-name { font-weight: 700; font-size: 1rem; }
    .card-url { font-size: .72rem; color: var(--text-muted); margin-top: 1px; }
    .card-desc { font-size: .82rem; color: var(--text-muted); line-height: 1.5; flex: 1; }
    .card-tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag {
      font-size: .68rem; padding: 3px 8px; border-radius: 20px;
      background: rgba(99,102,241,.15); color: var(--accent2); font-weight: 500;
    }
    .card-arrow { position: absolute; right: 16px; top: 20px; color: var(--text-muted); font-size: .85rem; opacity: 0; transition: opacity .2s; }
    .card:hover .card-arrow { opacity: 1; }
    .badge-new {
      position: absolute; right: 12px; bottom: 12px;
      background: linear-gradient(135deg, #f59e0b, #ef4444);
      color: #fff; font-size: .6rem; font-weight: 800;
      padding: 2px 7px; border-radius: 20px; letter-spacing: .05em;
    }
    .updated-info { font-size: .75rem; color: var(--text-muted); margin-top: 2px; }

    .empty { text-align: center; padding: 80px 20px; color: var(--text-muted); }
    .empty span { font-size: 3rem; display: block; margin-bottom: 12px; }

    @media (max-width: 768px) {
      aside { display: none; }
      main { padding: 20px 16px; }
      .top-btn span.label { display: none; }
    }
  </style>
</head>

let curSub = 'all';
let query  = '';

const tagMap = {
  chat:'챗봇 / LLM', search:'검색 AI', agent:'AI 에이전트',
  image:'이미지 생성', music:'음악 생성', video:'영상 생성', voice:'음성 생성',
  builder:'앱 빌더', code:'코드 어시스턴트', workflow:'워크플로우',
  writing:'글쓰기 / 문서', present:'발표 / 디자인', meeting:'회의 / 요약', learning:'학습 / 리서치',
  hub:'모델 허브', community:'커뮤니티', company:'AI 기업',
  cursor:'Cursor', windsurf:'Windsurf', vscode:'VS Code', figma:'Figma', general:'종합 플랫폼',
  ide:'AI IDE/에디터', model:'코딩 AI 모델', deploy:'배포/인프라', ui:'UI/프레임워크',
};

// HTML 이스케이프 — innerHTML에 외부 데이터를 넣을 때 반드시 사용
function esc(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// URL 화이트리스트 검증 — javascript: 등 위험 프로토콜 차단
function safeUrl(url) {
  try {
    const u = new URL(url);
    return (u.protocol === 'https:' || u.protocol === 'http:') ? url : '#';
  } catch { return '#'; }
}

function countSub(cat, sub) {
  if (sub === 'all') return data[cat].items.length;
  return data[cat].items.filter(i => i.tags.includes(sub)).length;
}

function renderSidebar() {
  const subs = data[curCat].subs;
  const sidebar = document.getElementById('sidebar');
  sidebar.innerHTML = '';

  const label = document.createElement('div');
  label.className = 'side-label';
  label.textContent = data[curCat].label;
  sidebar.appendChild(label);

  Object.entries(subs).forEach(([k, v]) => {
    const btn = document.createElement('button');
    btn.className = 'side-btn' + (curSub === k ? ' active' : '');
    btn.dataset.sub = k;

    const iconSpan = document.createElement('span');
    iconSpan.textContent = v.icon;
    const labelSpan = document.createElement('span');
    labelSpan.textContent = v.label;
    const countSpan = document.createElement('span');
    countSpan.className = 'side-count';
    countSpan.textContent = countSub(curCat, k);

    btn.append(iconSpan, labelSpan, countSpan);
    btn.addEventListener('click', () => { curSub = k; render(); });
    sidebar.appendChild(btn);
  });
}

function renderHeader() {
  document.getElementById('section-title').textContent = `${data[curCat].icon} ${data[curCat].label}`;
  document.getElementById('section-desc').textContent  = data[curCat].desc;
  document.getElementById('updated-info').textContent  = `🗓 마지막 업데이트: ${UPDATED} · 총 ${data[curCat].items.length}개 서비스`;
}

function makeCard(item) {
  const a = document.createElement('a');
  a.className = 'card';
  a.href = safeUrl(item.url);
  a.target = '_blank';
  a.rel = 'noopener noreferrer';
  a.style.setProperty('--card-color', /^#[0-9a-fA-F]{3,6}$/.test(item.color) ? item.color : '#6366f1');

  const top = document.createElement('div');
  top.className = 'card-top';

  const iconDiv = document.createElement('div');
  iconDiv.className = 'card-icon';
  iconDiv.textContent = item.icon;

  const info = document.createElement('div');
  const name = document.createElement('div');
  name.className = 'card-name';
  name.textContent = item.name;
  const urlDiv = document.createElement('div');
  urlDiv.className = 'card-url';
  urlDiv.textContent = item.url.replace('https://', '');
  info.append(name, urlDiv);
  top.append(iconDiv, info);

  const desc = document.createElement('div');
  desc.className = 'card-desc';
  desc.textContent = item.desc;

  const tags = document.createElement('div');
  tags.className = 'card-tags';
  item.tags.forEach(t => {
    const span = document.createElement('span');
    span.className = 'tag';
    span.textContent = tagMap[t] || t;
    tags.appendChild(span);
  });

  const arrow = document.createElement('span');
  arrow.className = 'card-arrow';
  arrow.textContent = '↗';

  if (item.isNew) {
    const badge = document.createElement('span');
    badge.className = 'badge-new';
    badge.textContent = 'NEW';
    a.appendChild(badge);
  }

  a.append(top, desc, tags, arrow);
  return a;
}

function renderCards() {
  let items = data[curCat].items;
  if (curSub !== 'all') items = items.filter(i => i.tags.includes(curSub));
  if (query) items = items.filter(i =>
    i.name.toLowerCase().includes(query) || i.desc.toLowerCase().includes(query));

  const grid = document.getElementById('grid');
  grid.innerHTML = '';

  if (!items.length) {
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.style.gridColumn = '1 / -1';
    const emoji = document.createElement('span');
    emoji.textContent = '😕';
    const msg = document.createTextNode('검색 결과가 없습니다.');
    empty.append(emoji, msg);
    grid.appendChild(empty);
    return;
  }
  items.forEach(item => grid.appendChild(makeCard(item)));
}

function render() {
  renderSidebar();
  renderHeader();
  renderCards();
  document.querySelectorAll('.top-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.cat === curCat));
}

document.querySelectorAll('.top-btn').forEach(b =>
  b.addEventListener('click', () => { curCat = b.dataset.cat; curSub = 'all'; render(); }));

document.getElementById('search').addEventListener('input', e => {
  query = e.target.value.toLowerCase().trim(); renderCards(); });

render();
</script>
</body>
</html>
